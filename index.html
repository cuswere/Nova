<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Praxis Nova — an updating roster of grants, exhibitions, residencies, and other opportunities for artists.">

    <title>Praxis Nova</title>
    <link rel="stylesheet" href="styles.css?v=2104f1f9">
</head>
<body class="page-home">
    <div class="content-wrapper screen-refresh">

        <header class="field page-header">
            <h1 class="page-title"><span class="title">Home</span></h1>
            <!-- Home-only flourish. The spans are deliberately bare: every cloud's
                 art and timing is set by :nth-child in styles.css, so the whole sky
                 is tuned in one place and reordering here reshuffles it. -->
            <div class="header-sky" aria-hidden="true">
                <span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span>
                <span class="cloud"></span><span class="cloud"></span><span class="cloud"></span><span class="cloud"></span>
            </div>
        </header>

        <div class="home-wordmark"><a class="praxis-mark" href="https://praxiscenterforaestheticstudies.com" target="_blank" rel="noopener noreferrer" data-confirm-exit>Praxis</a><span class="nova-mark" aria-hidden="true">nova</span><span class="beta-mark">beta</span></div>

        <dialog class="exit-dialog" tabindex="-1" aria-label="Leave Praxis Nova">
            <div class="exit-dialog-grip" aria-hidden="true"></div>
            <form method="dialog" class="exit-dialog-body">
                <p class="exit-dialog-message">Open <span class="exit-dialog-host"></span>?</p>
                <div class="exit-dialog-actions">
                    <button type="submit" value="yes" class="form-submit">Yes</button>
                    <button type="submit" value="no" class="form-submit">No</button>
                </div>
            </form>
        </dialog>

        <div class="field options-container">
            <div class="opportunity-group">
                <div class="option-btn-container">
                    <span class="option-btn option-btn-opportunities">
                        <a href="opportunities.html">Opportunities</a>
                        <button class="info" type="button" aria-expanded="false" aria-controls="opportunities-details">+</button>
                    </span>
                    <div class="option-details" id="opportunities-details">
                        <div class="option-details-row">
                            <a class="sublink" href="opportunities.html?type=grant">Grants</a>
                            <span class="sep" aria-hidden="true">+</span>
                            <a class="sublink" href="opportunities.html?type=exhibition">Exhibitions</a>
                            <span class="sep" aria-hidden="true">+</span>
                            <a class="sublink" href="opportunities.html?type=residency">Residencies</a>
                            <span class="sep" aria-hidden="true">+</span>
                            <span class="sublink">More</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="action-group">
                <div class="option-btn-container">
                    <span class="option-btn option-btn-feedback"><a href="feedback.html">Send<br>Feedback</a></span>
                </div>
                <div class="option-btn-container">
                    <span class="option-btn option-btn-grant-writer"><a href="https://page.praxiscenterforaesthetics.com/praxis-grant-kit/grant-application" target="_blank" rel="noopener">Hire a<br>Grant Writer</a></span>
                </div>
            </div>
            <!-- Last in source because the wide layout places it explicitly; the
                 narrow one reorders it above the two secondary buttons in CSS. -->
            <section class="featured-group" aria-labelledby="featured-heading">
                <h2 class="featured-heading" id="featured-heading">Featured Opportunities</h2>
                <div class="featured-list" data-featured-list>
                    <p class="featured-status">Loading…</p>
                </div>
            </section>
        </div>

    </div>

    <script type="module" src="scripts/home.js?v=2975e6d8"></script>
</body>
</html>
