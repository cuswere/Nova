<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse an updating roster of grants, exhibitions, residencies, and other opportunities for artists.">

ansform='translate(26 25)'/%3E%3C/svg%3E">
    <title>Praxis Nova</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="content-wrapper">
        <div class="screen-refresh" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

        <header class="field page-header">
            <h1 class="page-title"><span class="title">Opportunities</span></h1>
            <nav class="title-options" aria-label="Page navigation">
                <a href="index.html" class="title-option">Home</a>
            </nav>
        </header>

        <div class="field columns">
            <div class="repo-column">
                <div class="repo-toolbar">
                    <div class="pagination-tab" aria-live="polite">Page 1</div>
                    <div class="pagination-arrows">
                        <button type="button" class="page-arrow page-prev" aria-label="Previous page" disabled>◀</button>
                        <button type="button" class="page-arrow page-next" aria-label="Next page">▶</button>
                    </div>
                    <button type="button" class="search-tab" aria-expanded="false" aria-controls="opportunity-search">Search</button>
                    <div class="search-field" id="opportunity-search" hidden>
                        <input type="search" class="search-input" placeholder="Name contains…" aria-label="Search opportunities by name" autocomplete="off" spellcheck="false">
                        <button type="button" class="search-clear" aria-label="Clear search and close" hidden>×</button>
                    </div>
                </div>
                <div class="repo">
                    <div class="repobox"></div>
                </div>
            </div>
            <div class="filters">
                <div class="filter-selectors">
                    <div class="custom-select" aria-hidden="false">
                        <button class="custom-selected" type="button" aria-haspopup="listbox" aria-expanded="false"><span class="custom-selected-label">Category</span></button>
                        <ul class="custom-options" role="listbox" aria-hidden="true"></ul>
                    </div>
                    <div class="checkbox-filters">
                        <label class="filter-dropdown checkbox-label">
                            <input id="hide-fees-toggle" class="checkbox-input" type="checkbox" />
                            <span class="checkbox-text">Hide Fees</span>
                        </label>
                        <label class="filter-dropdown checkbox-label">
                            <input id="rolling-toggle" class="checkbox-input" type="checkbox" />
                            <span class="checkbox-text">Only Rolling</span>
                        </label>
                    </div>
                </div>
                <div class="filters-divider">
                    <div class="filters-title">Filters</div>
                    <div class="applied-filters">
                        <div class="filter-item">none</div>
                    </div>
                </div>
            </div>  
        </div>
    </div>
    <script type="module" src="scripts/opportunities.js"></script>
</body>
</html>
