name: Refresh featured articles

# Posts land on Wednesdays. 01:00 UTC on Thursday and Friday is 9pm Wednesday and
# 9pm Thursday Eastern in summer, 8pm in winter — cron cannot follow daylight
# saving, so the hour is set late deliberately, never before the 8pm cutoff.
# The Thursday run is the safety net for a late upload.
on:
  schedule:
    - cron: '0 1 * * 4,5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: featured-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run sync-featured

      - name: Commit updated featured articles
        shell: bash
        run: |
          # sync-featured also runs stamp.js, which updates the tracked asset
          # references that lead browsers to the new JSON. Keep those references
          # in the same commit as the data they describe.
          if git diff --quiet; then
            echo "No featured article changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Refresh featured articles"
          git push
